name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  api-server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run backend tests
        run: mvn -B test

  mobile-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.44.0"
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze
      - name: Run widget tests
        run: flutter test
