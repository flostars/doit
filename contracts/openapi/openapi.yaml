openapi: 3.1.0
info:
  title: doit API
  version: 0.1.0
  description: Shared API contract for the mobile client and Java backend.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/health:
    get:
      tags:
        - system
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
components:
  schemas:
    HealthResponse:
      type: object
      required:
        - service
        - status
      properties:
        service:
          type: string
          example: api-server
        status:
          type: string
          example: ok
